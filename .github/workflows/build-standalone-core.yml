name: Strato Mirror Original GPU Baseline APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-standalone-core.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: strato-original-gpu-baseline
  cancel-in-progress: false

jobs:
  baseline:
    name: Clean Strato mirror renderer ARM64 comparison
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - name: Checkout pinned standalone Strato mirror without Synolsis
        uses: actions/checkout@v4
        with:
          ref: 0cdd2b254b7ff8dcddb950c5ca5ec508f675947d
          fetch-depth: 1
          submodules: false

      - name: Prove native renderer is pristine Strato mirror
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .gitmodules
          test -f UPSTREAM_PROVENANCE.md
          grep -q "ae1566a48285816a87e81d4aeb40bd2f4e56e60b" UPSTREAM_PROVENANCE.md
          test -f app/libraries/boost/LICENSE_1_0.txt
          test -f app/libraries/oboe/README.md
          git log -1 --oneline
          echo 'Using pre-Synolsis Strato mirror. Modern firmware key fixes and vendored dependencies are in mirror.' >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Exclude only known unused Oboe sample wrapper
        shell: bash
        run: |
          set -euo pipefail
          unused=app/libraries/oboe/apps/OboeTester/gradle/wrapper/gradle-wrapper.jar
          if [ -f "$unused" ]; then
            printf '%s  %s\n' 'e2b82129ab64751fd40437007bd2f7f2afb3c6e41a9198e628650b22d5824a14' "$unused" | sha256sum --check --status
            rm -- "$unused"
          fi

      - name: Setup Gradle with caching and wrapper validation
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install Android SDK/NDK with retry on broken download
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ccache >/dev/null || ! command -v ninja >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ccache ninja-build
          fi
          mkdir -p "$CCACHE_DIR"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then
            SDKMGR="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          fi
          test -n "$SDKMGR"

          install_checked() {
            local spec="$1"
            local directory="$2"
            local marker="$3"
            if [ -f "$directory/$marker" ]; then
              echo "Already installed: $spec"
              return 0
            fi
            for attempt in 1 2 3 4; do
              echo "::group::Installing $spec (attempt $attempt/4)"
              # SDK archives can occasionally arrive truncated or as an
              # invalid ZIP from the mirror. Never treat a partial NDK as valid.
              if "$SDKMGR" --install "$spec" && [ -f "$directory/$marker" ]; then
                echo "::endgroup::"
                return 0
              fi
              echo "::warning::$spec download or validation failed (attempt $attempt)"
              echo "::endgroup::"
              if [ "$attempt" -eq 4 ]; then
                echo "::error::Failed to install $spec after four attempts"
                return 1
              fi
              rm -rf -- "$HOME/.android/cache"
              # A failed NDK extract can leave an invalid directory in place.
              # The directory is under the runner's ephemeral SDK installation.
              if [ ! -f "$directory/$marker" ] && [ -d "$directory" ]; then
                rm -rf -- "$directory"
              fi
              sleep $((attempt * 8))
            done
          }

          install_checked "platforms;android-34" "$SDK_ROOT/platforms/android-34" "android.jar"
          install_checked "build-tools;34.0.0" "$SDK_ROOT/build-tools/34.0.0" "aapt2"
          install_checked "ndk;26.1.10909125" "$SDK_ROOT/ndk/26.1.10909125" "source.properties"
          install_checked "cmake;3.22.1" "$SDK_ROOT/cmake/3.22.1" "bin/cmake"
          echo "Android SDK/NDK validated after installation"

      - name: Compile original Strato Kotlin
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileDevReldebugKotlin --no-daemon --build-cache

      - name: Compile independent Strato renderer and APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDevReldebug --no-daemon --stacktrace --build-cache
          test -n "$(find app/build/outputs/apk/dev/reldebug -maxdepth 1 -name '*.apk' -print -quit)"

      - name: Publish Strato baseline APK via GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(app/build/outputs/apk/dev/reldebug/*.apk)
          if (( ${#files[@]} == 0 )); then echo "::error::No baseline APK"; exit 1; fi
          tag="strato-original-gpu-baseline-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target 0cdd2b254b7ff8dcddb950c5ca5ec508f675947d \
            --title "Strato original GPU baseline test ${GITHUB_RUN_NUMBER}" \
            --notes "Comparative APK built from Strato standalone mirror at pinned SHA, without Synolsis GPU/UI modifications. Mirror includes firmwares key-generation compatibility patches and vendored dependencies, so not byte-for-byte untouched upstream. Uses org.stratoemu.strato.dev package; manually select handheld mode and the SAME GPU driver/game/save as Synolsis. No claim that this fixes flicker. BACK UP save data." \
            --prerelease
          for f in "${files[@]}"; do sha256sum "$f"; done
          echo "Strato baseline release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}" >> "$GITHUB_STEP_SUMMARY"
