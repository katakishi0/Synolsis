name: Standalone Strato Core APK

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-standalone-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone:
    name: Build self-contained core branch
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout independent Strato source branch
        uses: actions/checkout@v4
        with:
          ref: strato-full-core
          fetch-depth: 1
          submodules: false

      - name: Verify vendor status and firmware key generation patch
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .gitmodules
          test -z "$(git ls-files -s | grep '^160000 ' || true)"
          test -f app/libraries/boost/LICENSE_1_0.txt
          test -f app/libraries/oboe/README.md
          grep -F 'IndexedKeys128 = std::array<std::optional<Key128>, 0x20>' app/src/main/cpp/skyline/crypto/key_store.h
          grep -F 'keyGeneration >= keys.size()' app/src/main/cpp/skyline/vfs/nca.cpp
          git log -1 --oneline

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then
            SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          fi
          test -n "$SDKMGR"
          "$SDKMGR" --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Assemble independent Strato ARM64 APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDevDebug --no-daemon --stacktrace --build-cache

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: skyline-strato-standalone-fw23-experimental
          path: app/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error
          retention-days: 7
