name: Cached Strato Android APK Test

# This workflow is stored on main but checks out our self-contained core branch.
# A push to this YAML warms the caches. Subsequent manual builds reuse them.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache-build-test.yml'
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Standalone core source branch'
        type: choice
        required: true
        default: strato-full-core
        options:
          - strato-full-core
          - strato-fw23-zbic

permissions:
  contents: read

concurrency:
  group: cached-strato-build-${{ inputs.source_branch || 'strato-full-core' }}
  cancel-in-progress: false

jobs:
  cached-apk:
    name: ARM64 devDebug / Gradle + ccache
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPRESS: 'true'
      CCACHE_COMPRESSLEVEL: '5'
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - name: Checkout owned self-contained Strato source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_branch || 'strato-full-core' }}
          submodules: false
          fetch-depth: 1

      - name: Verify local source is completely self-contained
        shell: bash
        run: |
          set -euo pipefail
          test ! -f .gitmodules
          test -z "$(git ls-files -s | grep '^160000 ' || true)"
          test -f app/CMakeLists.txt
          test -f app/libraries/boost/LICENSE_1_0.txt
          echo "Source SHA: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: ${{ inputs.source_branch || 'strato-full-core' }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore and save Gradle dependencies and build cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-cleanup: on-success

      - name: Install ccache and Ninja
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache ninja-build
          mkdir -p "$CCACHE_DIR"
          ccache --set-config max_size="$CCACHE_MAXSIZE"
          ccache --version | head -1

      - name: Restore C/C++ compiler cache
        id: cpp-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: strato-ccache-v1-${{ runner.os }}-ndk26-${{ inputs.source_branch || 'strato-full-core' }}-${{ hashFiles('app/CMakeLists.txt', 'app/build.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            strato-ccache-v1-${{ runner.os }}-ndk26-${{ inputs.source_branch || 'strato-full-core' }}-

      - name: Install missing Android SDK components (only if needed)
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          export ANDROID_HOME="$SDK_ROOT"
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then
            SDKMGR="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          fi
          test -n "$SDKMGR"
          packages=()
          test -d "$SDK_ROOT/platforms/android-34" || packages+=("platforms;android-34")
          test -d "$SDK_ROOT/build-tools/34.0.0" || packages+=("build-tools;34.0.0")
          test -d "$SDK_ROOT/ndk/26.1.10909125" || packages+=("ndk;26.1.10909125")
          test -d "$SDK_ROOT/cmake/3.22.1" || packages+=("cmake;3.22.1")
          if (("${#packages[@]}" > 0)); then
            "$SDKMGR" --install "${packages[@]}"
          else
            echo "Android SDK/NDK/CMake packages already available"
          fi

      - name: Build ARM64 devDebug APK
        id: compile
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ccache --zero-stats
          start=$SECONDS
          ./gradlew :app:assembleDevDebug --no-daemon --stacktrace --build-cache
          elapsed=$((SECONDS - start))
          echo "Build duration: ${elapsed}s" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Cache and compiler statistics
        if: always()
        shell: bash
        run: |
          echo "### Cache report" >> "$GITHUB_STEP_SUMMARY"
          echo "C/C++ cache exact hit: ${{ steps.cpp-cache.outputs.cache-hit }}" >> "$GITHUB_STEP_SUMMARY"
          if command -v ccache >/dev/null; then
            {
              echo '```'
              ccache --show-stats
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            ccache --show-stats
          fi
          echo "Gradle cache: gradle/actions/setup-gradle@v4" >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub cache expiry is controlled in repository Settings > Actions > General > Cache settings (set 30 days there)." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish APK ZIP for 30 days
        uses: actions/upload-artifact@v4
        with:
          name: strato-cached-${{ inputs.source_branch || 'strato-full-core' }}-${{ github.run_number }}
          path: app/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error
          retention-days: 30
