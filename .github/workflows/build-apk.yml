name: Experimental Android APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'patches/pr-2200.patch'
      - 'patches/pr-2201.patch'
  workflow_dispatch:
    inputs:
      patch:
        description: 'Patch preset to stage for this build'
        type: choice
        required: true
        default: none
        options:
          - none
          - '252'
          - '291'
          - '9001'
          - '2200'
          - '2201'
          - 'firmware-22'

permissions:
  contents: read

concurrency:
  group: experimental-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      PATCH_ID: ${{ inputs.patch || 'firmware-22' }}
    steps:
      - name: Check out toolkit and complete Strato core
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/cmdline-tools"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then
            SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          fi
          test -n "$SDKMGR"
          "$SDKMGR" --version
          "$SDKMGR" --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Report source revision and selected fix
        run: |
          git submodule status upstream/strato
          echo "Staged patch ID: $PATCH_ID"
          python -m unittest discover -s tests -q

      - name: Stage selected candidate in a clean upstream checkout
        if: env.PATCH_ID != 'none'
        run: |
          if [ "$PATCH_ID" = "firmware-22" ]; then
            git -C upstream/strato apply --check ../../patches/pr-2200.patch ../../patches/pr-2201.patch
            git -C upstream/strato apply ../../patches/pr-2200.patch ../../patches/pr-2201.patch
          else
            python tools/verify_patches.py --upstream upstream/strato --pr "$PATCH_ID" --write
          fi

      - name: Build Strato ARM64 dev debug APK
        working-directory: upstream/strato
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDevDebug --no-daemon --stacktrace --build-cache

      - name: Publish experimental APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: skyline-strato-devdebug-${{ inputs.patch || 'firmware-22' }}
          path: upstream/strato/app/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error
          retention-days: 7
