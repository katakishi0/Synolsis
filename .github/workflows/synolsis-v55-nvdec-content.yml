name: Synolsis V55 NVDEC Modes and Minimal Content APK
on:
  push:
    branches:
      - feature/synolsis-v55-nvdec-modes-qlauncher-content-ui
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: synolsis-v55-nvdec-modes-qlauncher-content-ui
  cancel-in-progress: true
jobs:
  host-queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile C++20 queue and validate frame order / memory budget
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic \
            tests/nvdec_frame_queue_test.cpp -o /tmp/synolsis-v52-queue
          /tmp/synolsis-v52-queue
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic \
            tests/vic_aligned_output_test.cpp -o /tmp/synolsis-v53-aligned-vic
          /tmp/synolsis-v53-aligned-vic
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic \
            tests/mediacodec_output_slice_test.cpp -o /tmp/synolsis-v53-ndk-buffers
          /tmp/synolsis-v53-ndk-buffers
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic \
            tests/vic_mediacodec_crop_test.cpp -o /tmp/synolsis-v53-crop
          /tmp/synolsis-v53-crop
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic \
            tests/vic_rgb_output_test.cpp -o /tmp/synolsis-v53-rgb
          /tmp/synolsis-v53-rgb
          python3 - <<'PY'
          from pathlib import Path
          c=Path('app/src/main/cpp/skyline/soc/host1x/classes/nvdec.cpp').read_text()
          h=Path('app/src/main/cpp/skyline/soc/host1x/classes/nvdec.h').read_text()
          assert 'readyFrames.Push(std::move(frame))' in c
          assert 'readyFrames.Take()' in c
          assert 'readyFrames.Clear()' in c
          assert 'BoundedFrames<AndroidMediaDecoder::Frame>' in h
          assert 'std::optional<AndroidMediaDecoder::Frame> readyFrame;' not in h
          vic=Path('app/src/main/cpp/skyline/soc/host1x/classes/vic.cpp').read_text()
          policy=Path('app/src/main/cpp/skyline/soc/host1x/classes/vic_yuv420_output.h').read_text()
          assert 'DecodedFrameCoversSurface' in policy and vic
          assert vic.count('data, surface.width, surface.height,') == 2
          assert 'decoded-frame-vic-extent-mismatch' in vic
          assert 'frame.width), static_cast<u32>(frame.height)' not in vic
          decoder=Path('app/src/main/cpp/skyline/soc/host1x/classes/android_media_decoder.cpp').read_text()
          assert 'codec_output::ChooseOutputSlice(' in decoder
          assert 'android_get_device_api_level()' in decoder
          assert 'buffer + info.offset' not in decoder
          # V54 is a source checkpoint, not proof of functioning cutscenes.
          from pathlib import Path
          root=Path('app/src/main')
          dialog=(root/'java/org/stratoemu/strato/AppDialog.kt').read_text()
          layout=(root/'res/layout/app_dialog.xml').read_text()
          content=(root/'java/org/stratoemu/strato/GameContentManagerActivity.kt').read_text()
          profiles=(root/'java/org/stratoemu/strato/settings/SynolsisGpuProfiles.kt').read_text()
          qlauncher=(root/'java/org/stratoemu/strato/SynolsisSettingsHubActivity.kt').read_text()
          assert 'gameInstallContent' in dialog and 'game_install_content' in layout
          assert 'GameContentStore.Kind.UPDATE, GameContentStore.Kind.DLC' in content
          assert 'synolsis_v54_vulkan_light' in (root/'res/xml/emulation_preferences.xml').read_text()
          assert 'VULKAN_LITE ->' in profiles and 'settings.freeGuestTextureMemory = false' in profiles
          assert 'qlauncher_cache' in (root/'res/xml/synolsis_firmware_paths.xml').read_text()
          assert 'Synolsis NVDEC/VIC guest frame write' in vic
          assert 'Synolsis-QLauncher' in qlauncher
          native=(root/'cpp/skyline').resolve()
          common=(root/'cpp/skyline/common/settings.h').read_text()
          android=(root/'cpp/skyline/common/android_settings.h').read_text()
          decoder=(root/'cpp/skyline/soc/host1x/classes/android_media_decoder.cpp').read_text()
          enum=(root/'cpp/skyline/soc/host1x/classes/android_media_decoder.h').read_text()
          nca=(root/'java/org/stratoemu/strato/provider/SynolsisHomeNcaProvider.kt').read_text()
          manifest=(root/'AndroidManifest.xml').read_text()
          prefs=(root/'xml/emulation_preferences.xml').read_text() if (root/'xml/emulation_preferences.xml').exists() else (root/'res/xml/emulation_preferences.xml').read_text()
          assert 'nvdecMode' in common and 'nvdecMode' in android and 'DecoderMode::SoftwareAndroid' in decoder
          assert 'DecoderMode::Hybrid' in decoder and 'nvdec_mode' in prefs
          assert 'class SynolsisHomeNcaProvider' in nca and '.synolsis.home' in manifest
          assert 'setSingleChoiceItems' in content and 'MaterialButton' in content
          print('PASS: V55 NVDEC native selector, read-only firmware provider, minimal add-ons source checks')
          PY

  android-native:
    name: Build V55 Android ARM64 experimental APK
    needs: host-queue
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: 'true'
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Remove only the known unused Oboe test Gradle wrapper
        run: |
          set -euo pipefail
          wrapper=app/libraries/oboe/apps/OboeTester/gradle/wrapper/gradle-wrapper.jar
          if [ -f "$wrapper" ]; then
            printf '%s  %s\n' 'e2b82129ab64751fd40437007bd2f7f2afb3c6e41a9198e628650b22d5824a14' "$wrapper" | sha256sum --check --status
            rm -- "$wrapper"
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Install exact Android native toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache ninja-build
          mkdir -p "$CCACHE_DIR"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then
            SDKMGR="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          fi
          test -x "$SDKMGR"
          "$SDKMGR" --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
          test -f "$SDK_ROOT/ndk/26.1.10909125/source.properties"
      - name: Compile frontend and full native ARM64 APK without publishing
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:compileMainlineOptimizedKotlin --no-daemon --build-cache
          ./gradlew :app:assembleMainlineOptimized --no-daemon --stacktrace --build-cache
          ls -lah app/build/outputs/apk/mainline/*/*.apk
          echo "Compiled V55 codec mode routing, HOME NCA ContentProvider, and minimal Complementos UI." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish experimental APK to GitHub Releases (requires user device verification)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(app/build/outputs/apk/mainline/*/*.apk)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No Android ARM64 APK built"
            exit 1
          fi
          tag="synolsis-v55-nvdec-content-experimental-${GITHUB_RUN_NUMBER}"
          notes="V55 EXPERIMENTAL: minimal Complementos UI; QLauncher read-only streaming provider instead of brittle FileProvider root; Android NVDEC codec mode selector (Auto, hardware preferred, Android software, hybrid configure fallback) bridged to native per-game settings. IMPORTANT: cutscenes and HOME remain UNVERIFIED; NVDEC mode cannot fix missing GPU coherency or Host1x fences; updates/DLC remain STAGED, not active; FSR/frame generation and true internal resolution NOT implemented. No games, firmware or keys. Submit redacted emulator/logcat traces."
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Synolsis V55 NVDEC Modes, QLauncher Stream and Minimal Add-ons (Experimental) ${GITHUB_RUN_NUMBER}" \
              --notes "$notes" --prerelease
          fi
          {
            echo "### Experimental V55 APK (NVDEC cutscene and HOME not yet confirmed)"
            echo "Source SHA: $GITHUB_SHA"
            echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
            for file in "${files[@]}"; do
              echo "APK: $file"
              sha256sum "$file"
            done
          } >> "$GITHUB_STEP_SUMMARY"
