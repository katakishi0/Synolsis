name: Cached Strato Android CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cached-android-ci.yml'
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Build a debug APK in addition to running tests'
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: cached-android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tool-tests:
    name: Offline parser and patch regression tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout toolkit branch
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run tests without proprietary files
        run: python -m unittest discover -s tests -v

  build:
    name: Compile self-contained Strato ARM64 APK (cached)
    needs: [tool-tests]
    if: github.event_name != 'workflow_dispatch' || inputs.build_apk
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: 'true'
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      GRADLE_OPTS: '-Dorg.gradle.caching=true'
    steps:
      - name: Checkout fully vendored core (no external submodules)
        uses: actions/checkout@v4
        with:
          ref: strato-full-core
          submodules: false
          fetch-depth: 1

      - name: Check that native dependencies are self-contained
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .gitmodules
          test -z "$(git ls-files -s | grep '^160000 ' || true)"
          test -f app/libraries/boost/LICENSE_1_0.txt
          test -f app/libraries/oboe/README.md
          echo "Core: $(git rev-parse --short HEAD)"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore and save Gradle dependencies and build cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-cleanup: on-success

      - name: Cache native C/C++ compiled objects
        id: native-cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-strato-arm64-ccache-v1-${{ hashFiles('app/CMakeLists.txt', 'app/build.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-strato-arm64-ccache-v1-${{ hashFiles('app/CMakeLists.txt', 'app/build.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}-
            ${{ runner.os }}-strato-arm64-ccache-v1-

      - name: Install SDK/NDK and ccache when needed
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ccache >/dev/null || ! command -v ninja >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ccache ninja-build
          fi
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then
            SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          fi
          test -n "$SDKMGR"
          "$SDKMGR" --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
          mkdir -p "$CCACHE_DIR"
          ccache --set-config=max_size=2G
          ccache --set-config=compression=true
          ccache --zero-stats
          echo "Native cache restored: ${{ steps.native-cache.outputs.cache-hit }}"

      - name: Compile ARM64 debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleDevDebug --no-daemon --stacktrace --build-cache

      - name: Report C/C++ cache hit rate
        if: always()
        shell: bash
        run: |
          if command -v ccache >/dev/null; then
            ccache --show-stats
          fi

      - name: Upload APK as 30-day artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: skyline-strato-cached-devdebug-${{ github.run_number }}
          path: app/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error
          retention-days: 30
