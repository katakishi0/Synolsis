name: Synolsis V16 FidelityFX FSR1 EASU RCAS shader validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/synolsis-v16-fsr-shaders.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    name: Compile AMD FSR1 EASU and RCAS Vulkan compute passes
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout pinned FSR1 shader implementation
        uses: actions/checkout@v4
        with:
          ref: a3af3b18f88be5cda8265097e97d4c269ee68905
          submodules: false
      - name: Install reference shader compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools spirv-tools
      - name: Compile EASU and RCAS GLSL into Vulkan SPIR-V
        run: |
          bash scripts/build_fsr1_shaders.sh fsr-spv
          spirv-val --target-env vulkan1.1 fsr-spv/easu.spv
          spirv-val --target-env vulkan1.1 fsr-spv/rcas.spv
          echo "Compiled AMD MIT-licensed FSR1 EASU + RCAS shader binaries." >> "$GITHUB_STEP_SUMMARY"
          echo "Compute pipeline descriptor integration into Synolsis presentation is not yet complete." >> "$GITHUB_STEP_SUMMARY"
      - name: Publish pre-release shader binaries (avoids Actions artifact quota)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="synolsis-v16-fsr1-shaders-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" fsr-spv/easu.spv fsr-spv/rcas.spv \
            --repo "$GITHUB_REPOSITORY" \
            --target a3af3b18f88be5cda8265097e97d4c269ee68905 \
            --title "Synolsis FSR1 EASU/RCAS - shader-only test ${GITHUB_RUN_NUMBER}" \
            --notes "AMD MIT-licensed FSR1 EASU and RCAS compute shaders compiled with glslangValidator and spirv-val. This is an intermediate module; NOT yet enabled by the emulator Vulkan presenter." \
            --prerelease
