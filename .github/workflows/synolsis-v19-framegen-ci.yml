name: Synolsis V19 Temporal Frame Generation Shader CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/synolsis-v19-framegen-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    name: Compile temporal interpolation SPIR-V and scheduler tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout pinned interpolation source
        uses: actions/checkout@v4
        with:
          ref: bebe8cb5b491b3b3e3ea27b747f5ab93a7e20519
          submodules: false
      - name: Install glslang and SPIR-V validator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools spirv-tools
      - name: Unit-test generated frame cadence and fence gate
        run: |
          set -euo pipefail
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic tests/frame_interpolation_planner_test.cpp -o /tmp/synolsis-frameplan-test
          /tmp/synolsis-frameplan-test
          echo "PASS: bounded midpoint presentation times; no generated frame without two completed source images" >> "$GITHUB_STEP_SUMMARY"
      - name: Compile temporal interpolation compute stage
        run: |
          set -euo pipefail
          mkdir -p /tmp/synolsis-framegen
          glslangValidator -V --target-env vulkan1.1 -S comp \
            app/src/main/cpp/skyline/gpu/shaders/framegen/temporal_interpolate.comp \
            -o /tmp/synolsis-framegen/temporal_interpolate.spv
          spirv-val --target-env vulkan1.1 /tmp/synolsis-framegen/temporal_interpolate.spv
          python3 - <<'PY'
          from pathlib import Path
          import struct
          binary=Path('/tmp/synolsis-framegen/temporal_interpolate.spv').read_bytes()
          assert len(binary)>400 and len(binary)%4==0
          assert struct.unpack_from('<I',binary)[0]==0x07230203
          print(f'PASS: real Vulkan frame-interpolation compute shader {len(binary)} bytes')
          PY
          echo "No runtime generation yet: Vulkan history, sync, descriptor and swapchain frame pacing must still be wired." >> "$GITHUB_STEP_SUMMARY"
      - name: Publish shader prototype via GitHub Release, avoiding Actions quota
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="synolsis-v19-framegen-shader-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" /tmp/synolsis-framegen/temporal_interpolate.spv \
            --repo "$GITHUB_REPOSITORY" --target "bebe8cb5b491b3b3e3ea27b747f5ab93a7e20519" \
            --title "Synolsis V19 Temporal Interpolation Shader Test ${GITHUB_RUN_NUMBER}" \
            --notes "Prototype Vulkan shader producing a temporal intermediate frame. This is NOT complete runtime frame generation, and not FSR3; runtime Vulkan history/sync/presenter is still required." \
            --prerelease
