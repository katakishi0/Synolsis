name: Tooling and patch compatibility

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tool-tests:
    name: Python tooling tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Validate patch diff structure
        run: |
          python - <<'PY'
          import pathlib
          from tools.verify_patches import changed_files
          for pr in (252, 291, 9001):
              data = pathlib.Path(f"patches/pr-{pr}.patch").read_bytes()
              print(f"PR #{pr}: {changed_files(data)}")
          PY

  patch-compatibility:
    name: Check against pinned Strato commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Fetch pinned Skyline / Strato core
        run: git submodule update --init upstream/strato
      - name: Inspect upstream commit
        run: |
          git -C upstream/strato rev-parse HEAD
          git submodule status upstream/strato
      - name: Check firmware PR #252 (no modifications)
        run: python tools/verify_patches.py --pr 252
      - name: Check landscape PR #291 (no modifications)
        run: python tools/verify_patches.py --pr 291
      - name: Check Vulkan driver loader safeguard #9001 (no modifications)
        run: python tools/verify_patches.py --pr 9001
