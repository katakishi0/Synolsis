          unused=app/libraries/oboe/apps/OboeTester/gradle/wrapper/gradle-wrapper.jar
          if [ -f "$unused" ]; then
            printf '%s  %s\n' 'e2b82129ab64751fd40437007bd2f7f2afb3c6e41a9198e628650b22d5824a14' "$unused" | sha256sum --check --status
            rm -- "$unused"
          fi

      - name: Setup Gradle with caching and wrapper validation
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install Android SDK/NDK with retry on broken download
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ccache >/dev/null || ! command -v ninja >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ccache ninja-build
          fi
          mkdir -p "$CCACHE_DIR"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then
            SDKMGR="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          fi
          test -n "$SDKMGR"

          install_checked() {
            local spec="$1"
            local directory="$2"
            local marker="$3"
            if [ -f "$directory/$marker" ]; then
              echo "Already installed: $spec"
              return 0
            fi
            for attempt in 1 2 3 4; do
              echo "::group::Installing $spec (attempt $attempt/4)"
              # SDK archives can occasionally arrive truncated or as an
              # invalid ZIP from the mirror. Never treat a partial NDK as valid.
              if "$SDKMGR" --install "$spec" && [ -f "$directory/$marker" ]; then
                echo "::endgroup::"
                return 0
              fi
              echo "::warning::$spec download or validation failed (attempt $attempt)"
              echo "::endgroup::"
              if [ "$attempt" -eq 4 ]; then
                echo "::error::Failed to install $spec after four attempts"
                return 1
              fi
              rm -rf -- "$HOME/.android/cache"
              # A failed NDK extract can leave an invalid directory in place.
              # The directory is under the runner's ephemeral SDK installation.
              if [ ! -f "$directory/$marker" ] && [ -d "$directory" ]; then
                rm -rf -- "$directory"
              fi
              sleep $((attempt * 8))
            done
          }

          install_checked "platforms;android-34" "$SDK_ROOT/platforms/android-34" "android.jar"
          install_checked "build-tools;34.0.0" "$SDK_ROOT/build-tools/34.0.0" "aapt2"
          install_checked "ndk;26.1.10909125" "$SDK_ROOT/ndk/26.1.10909125" "source.properties"
          install_checked "cmake;3.22.1" "$SDK_ROOT/cmake/3.22.1" "bin/cmake"
          echo "Android SDK/NDK validated after installation"

      - name: Restore proven 2GiB native compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          # Keep the unique save key but share a compatible warm-cache prefix
          # with the verified 93.22% hit-rate V5 run (#37865518302).
          key: synolsis-v5-2gcache-ndk26-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            synolsis-v5-2gcache-ndk26-${{ runner.os }}-

      - name: Reset CCache statistics before compilation
        shell: bash
        run: |
          ccache --zero-stats
          echo "## V5 rollback APK with warm native cache" >> "$GITHUB_STEP_SUMMARY"
          echo "Source code pinned to the same rollback; CCache is build-only." >> "$GITHUB_STEP_SUMMARY"

      - name: Compile Android Kotlin frontend before expensive native build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          BUILD_TYPE="${{ inputs.build_type || 'optimized' }}"
          # Compile Kotlin first to surface nullable/type errors before C++.
          # Gradle reuses the successful Kotlin output during APK assembly.
          case "$BUILD_TYPE" in
            optimized) ./gradlew :app:compileMainlineOptimizedKotlin --no-daemon --build-cache ;;
            debug) ./gradlew :app:compileMainlineDebugKotlin --no-daemon --build-cache ;;
            *) echo "::error::Unknown build_type $BUILD_TYPE"; exit 1 ;;
          esac

      - name: Build Synolsis Emu APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          BUILD_TYPE="${{ inputs.build_type || 'optimized' }}"
          case "$BUILD_TYPE" in
            optimized)
              echo "Building optimized Strato core (-Ofast/LTO native), without R8 shrinking"
              ./gradlew :app:assembleMainlineOptimized --no-daemon --stacktrace --build-cache
              ;;
            debug)
              echo "Building original unoptimized Debug baseline"
              ./gradlew :app:assembleMainlineDebug --no-daemon --stacktrace --build-cache
              ;;
            *)
              echo "::error::Unknown build_type $BUILD_TYPE"
              exit 1
              ;;
          esac

      - name: Validate all Vulkan compute shaders are included in built APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile,glob
          packages=glob.glob("app/build/outputs/apk/mainline/*/*.apk")
          assert packages, "No ARM64 APK produced"
          for pkg in packages:
              with zipfile.ZipFile(pkg) as apk:
                  files=set(apk.namelist())
                  expected={"assets/shaders/synolsis/"+s+".spv" for s in ("easu","rcas","temporal_interpolate")}
                  assert expected <= files, f"{pkg} missing compiled compute SPIR-V: {expected-files}"
                  print(pkg, ": all 3 SPIR-V shader assets packaged")
          PY
          echo "PASS: EASU, RCAS and temporal interpolation assets reside inside the compiled APK" >> "$GITHUB_STEP_SUMMARY"

      - name: Report compiler cache statistics
        if: always()
        shell: bash
        run: |
          command -v ccache >/dev/null || exit 0
          ccache --show-stats | tee .ccache-stats.txt
          echo '### Native cache reuse' >> "$GITHUB_STEP_SUMMARY"
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          head -35 .ccache-stats.txt >> "$GITHUB_STEP_SUMMARY"
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"

      # GitHub Actions Artifacts quota can stay blocked for 6-12 hours.
      # The compiled APK must be delivered through Releases directly.
      - name: Publish APK to GitHub Releases (no Actions Artifacts quota)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(app/build/outputs/apk/mainline/*/*.apk)
          if (( ${#files[@]} == 0 )); then
            echo "::error::Gradle did not produce an APK"
            exit 1
          fi
          tag="synolsis-v27-compat-${GITHUB_RUN_NUMBER}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Rerunning a build must not fail just because its release exists.
            gh release upload "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "b7a4ad4257dab160fedfdf7f73b482537e434827" \
              --title "Synolsis V27 Vulkan + QLauncher + Compact UI test ${GITHUB_RUN_NUMBER}" \
              --notes "Android ARM64 experimental diagnostic APK: additional Vulkan memory ordering for texture readbacks/layout transitions, header-first QLauncher firmware scan, smaller bilingual settings UI. QLauncher still lacks complete Horizon services; true internal resolution, FSR dispatch and frame generation remain unavailable. User-reported V25 flicker fix and FPS improvement are NOT yet verified." \
              --prerelease
          fi
          {
            echo "### Download optimized APK (GitHub Releases)"
            echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
            echo "GitHub Actions artifact upload intentionally disabled while quota is exhausted."
            for apk in "${files[@]}"; do
              echo "APK: ${apk}"
              sha256sum "$apk"
            done
          } >> "$GITHUB_STEP_SUMMARY"
