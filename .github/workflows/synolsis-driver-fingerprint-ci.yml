name: Synolsis Adreno Optimization + Cache Safety APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/synolsis-driver-fingerprint-ci.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Native compilation mode (optimized for performance or debug baseline)'
        type: choice
        required: true
        default: optimized
        options:
          - optimized
          - debug

permissions:
  contents: read

concurrency:
  group: synolsis-vulkan-driver-fingerprint
  cancel-in-progress: false

jobs:
  build:
    name: Synolsis ARM64 Adreno optimization and transactional cache
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPRESS: 'true'
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - name: Checkout standalone Strato feature branch
        uses: actions/checkout@v4
        with:
          # Source is checked out at the start of the run, then built from that snapshot.
          ref: feature/synolsis-v4-ptbr-updates
          submodules: false

      - name: Assert full source is checked in
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .gitmodules
          test -z "$(git ls-files -s | grep '^160000 ' || true)"
          git log -1 --oneline

      - name: Verify Synolsis branding, themes and native cache invariants
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root=Path("app/src/main")
          resources=root/"res/values"
          for filename in ("synolsis_palettes.xml","strings.xml"):
              ET.parse(resources/filename)
          app=ET.parse(resources/"synolsis_palettes.xml").getroot()
          palettes=app.find("./string-array[@name='synolsis_palette_entries']")
          values=app.find("./integer-array[@name='synolsis_palette_values']")
          assert len(palettes)==len(values)==6
          assert [v.text for v in values]==[str(i) for i in range(6)]
          styles={s.attrib["name"] for s in app.findall("style")}
          for name in ("Midnight","Purple","Emerald","Amoled","Amber"):
              assert f"SynolsisTheme.{name}" in styles
          strings=ET.parse(resources/"strings.xml").getroot()
          assert strings.find("./string[@name='app_name']").text=="Synolsis Emu"
          main=ET.parse(root/"res/layout/main_activity.xml")
          assert any(node.tag.endswith("TextView") and node.attrib.get("{http://schemas.android.com/apk/res/android}id")=="@+id/title_text" for node in main.iter())
          ep=ET.parse(root/"res/xml/emulation_preferences.xml")
          assert any(x.attrib.get("{http://schemas.android.com/apk/res/android}key")=="category_experimental" for x in ep.iter())
          driver=(root/"cpp/skyline/gpu.cpp").read_text()
          cache=(root/"cpp/skyline/gpu/pipeline_cache_manager.cpp").read_text()
          assert cache.index("mainStream << stagingStream.rdbuf()") < cache.index("mainHeader.count += stagingHeader.count"), "Header must be committed after payload"
          assert 'Pipeline cache append failed; restoring previous length' in cache
          assert 'static_cast<std::streamoff>(originalEnd)' in cache
          assert "std::numeric_limits<u32>::max() - mainHeader.count" in cache
          assert "custom_{:016x}" in driver and "driverCacheKey" in driver
          assert "std::filesystem::remove(stagingPath, removeError)" in cache
          assert "stream.gcount() == static_cast<std::streamsize>(sizeof(PipelineCacheFileHeader))" in cache
          present=(root/"cpp/skyline/gpu/presentation_engine.cpp").read_text()
          assert 'falling back to FIFO' in present
          assert 'Clamping requested swapchain images' in present
          appxml=ET.parse(root/"AndroidManifest.xml")
          assert any(a.endswith("}icon") and v=="@drawable/synolsis_logo"
                     for el in appxml.iter() for a,v in el.attrib.items())
          ui=(root/"res/xml/app_preferences.xml").read_text()
          assert 'android:entryValues="@array/synolsis_palette_values"' in ui
          activity=(root/"java/org/stratoemu/strato/StratoApplication.kt").read_text()
          assert "applySynolsisPalette()" in activity
          assert "Application.ActivityLifecycleCallbacks" in activity
          title=(root/"res/layout/main_activity.xml").read_text()
          assert "@drawable/skyline_text" not in title
          theme=(root/"java/org/stratoemu/strato/settings/GlobalSettingsFragment.kt").read_text()
          assert '"synolsis_palette"' in theme
          print("Synolsis frontend smoke test")
          # UX: actual bottom navigation and real settings, not inert mockups.
          menu=ET.parse(root/"res/menu/synolsis_bottom_navigation.xml")
          expected={"nav_games","nav_search","nav_settings"}
          ids={x.attrib.get("{http://schemas.android.com/apk/res/android}id","").replace("@+id/","") for x in menu.getroot()}
          assert expected == ids
          layout=(root/"res/layout/main_activity.xml").read_text()
          assert "@+id/bottom_navigation" in layout
          main=(root/"java/org/stratoemu/strato/MainActivity.kt").read_text()
          assert "bottomNavigation.setOnItemSelectedListener" in main
          assert "binding.searchBar.focusInput()" in main
          gradle=Path("app/build.gradle").read_text()
          assert 'applicationId "org.synolsis.emu"' in gradle
          assert "namespace 'org.stratoemu.strato'" in gradle  # JNI compatibility
          profiles=(root/"java/org/stratoemu/strato/settings/SynolsisGpuProfiles.kt").read_text()
          assert "executorSlotCountScale" in profiles and "freeGuestTextureMemory" in profiles
          for fragment in ("GlobalSettingsFragment.kt","GameSettingsFragment.kt"):
              src=(root/"java/org/stratoemu/strato/settings"/fragment).read_text()
              assert "wireSynolsisGpuProfiles" in src
          hub=(root/"java/org/stratoemu/strato/SynolsisSettingsHubActivity.kt").read_text()
          for feature in ("GpuDriverActivity","synolsis_target_preference","SettingsActivity"):
              assert feature in hub, feature
          manifest=(root/"AndroidManifest.xml").read_text()
          assert 'android:name=".SynolsisSettingsHubActivity"' in manifest
          assert "SynolsisSettingsHubActivity::class.java" in main
          assert "synolsis_readback_precision" in (root/"res/xml/emulation_preferences.xml").read_text()
          assert "wireSynolsisReadbackPrecision" in theme
          assert "wireSynolsisReadbackPrecision" in (root/"java/org/stratoemu/strato/settings/GameSettingsFragment.kt").read_text()
          assert "SynolsisGpuProfiles" in profiles
          # Verify navigation is not duplicated or left as decorative entries.
          assert "SECTION_ADVANCED" in hub
          assert "SECTION_APPEARANCE" in hub
          assert "SECTION_CONTROLS" in hub
          assert "SECTION_CONTENT" in hub
          assert "SECTION_ABOUT" in hub
          assert "GpuDriverActivity::class.java" in hub
          assert "SynolsisSettingsHubActivity::class.java" in main
          assert "settingsCallback.launch(Intent(context, SynolsisSettingsHubActivity::class.java))" in main

          android_ns="{http://schemas.android.com/apk/res/android}"
          app_ns="{http://schemas.android.com/apk/res-auto}"
          emulation=ET.parse(root/"res/xml/emulation_preferences.xml")
          assert not [node for node in emulation.iter() if node.tag.endswith("GpuDriverPreference")], "Duplicate GPU driver in Advanced"
          game=ET.parse(root/"res/xml/custom_game_preferences.xml")
          choices=[node for node in game.iter() if node.tag.endswith("GpuDriverPreference")]
          assert len(choices)==1, "Per-game driver must be preserved"
          assert choices[0].get(android_ns+"dependency")=="use_custom_settings"
          assert choices[0].get(app_ns+"key")=="gpu_driver"

          global_prefs=(root/"java/org/stratoemu/strato/settings/GlobalSettingsFragment.kt").read_text()
          assert "when (section)" in global_prefs
          assert "preferenceScreen.removePreference(item)" in global_prefs
          for key in ("SECTION_APPEARANCE","SECTION_CONTENT","SECTION_CONTROLS","SECTION_ABOUT","SECTION_ADVANCED"):
              assert key in global_prefs
          assert "disableFrameThrottlingPref?.isChecked" in global_prefs
          settings=(root/"java/org/stratoemu/strato/settings/SettingsActivity.kt").read_text()
          assert "EXTRA_SYNOLSIS_SECTION" in settings
          assert "R.string.synolsis_hub_about" in settings

          gpu_source=(root/"cpp/skyline/gpu.cpp").read_text()
          # A selected package can be updated in place without changing the label.
          # Driver version, vendor, device and pipeline-cache UUID are necessary
          # to prevent replaying an incompatible old Vulkan cache.
          for field in ("properties.vendorID", "properties.deviceID",
                        "properties.driverVersion", "properties.apiVersion",
                        "properties.pipelineCacheUUID", 'fmt::format("custom_{:016x}"'):
              assert field in gpu_source, "Vulkan fingerprint missing "+field
          assert 'vkPhysicalDevice.getProperties()' in gpu_source
          assert 'std::hash' not in gpu_source.split("void GPU::Initialise()",1)[1] or 'std::hash is not stable' in gpu_source
          # Real host-frame skip / Vulkan present mode feature wiring (not
          # empty UI toggles). This verifies the complete Android-to-native path.
          frame_xml=ET.parse(root/"res/values/synolsis_frame_skip.xml").getroot()
          for prefix, bounds in (("synolsis_frame_skip", [0, 1, 2]),
                                 ("synolsis_present_mode", [0, 1, 2, 3])):
              arr=frame_xml.find("./integer-array[@name='"+prefix+"_values']")
              labels=frame_xml.find("./string-array[@name='"+prefix+"_entries']")
              assert arr is not None and labels is not None
              assert [int(v.text) for v in arr]==bounds
              assert len(labels)==len(bounds)
          ui=ET.parse(root/"res/xml/emulation_preferences.xml")
          app_ns="{http://schemas.android.com/apk/res-auto}"
          integer_prefs={
              node.get(app_ns+"key"):node for node in ui.iter()
              if node.tag.endswith("IntegerListPreference")
          }
          assert integer_prefs["presentation_frame_skip"] is not None
          assert integer_prefs["vulkan_present_mode"] is not None
          settings_cpp=(root/"cpp/skyline/common/settings.h").read_text()
          android_cpp=(root/"cpp/skyline/common/android_settings.h").read_text()
          kotlin=(root/"java/org/stratoemu/strato/settings/NativeSettings.kt").read_text()
          kpref=(root/"java/org/stratoemu/strato/settings/EmulationSettings.kt").read_text()
          for field in ("presentationFrameSkip", "vulkanPresentMode"):
              assert field in settings_cpp and field in android_cpp
              assert field in kotlin and field in kpref
          present=(root/"cpp/skyline/gpu/presentation_engine.cpp").read_text()
          present_h=(root/"cpp/skyline/gpu/presentation_engine.h").read_text()
          assert "frame.fence.Wait(state.soc->host1x)" in present
          assert "frame.presentCallback()" in present and "vsyncEvent->Signal()" in present
          assert "presentationFrameCounter++" in present and "presentationFrameCounter" in present_h
          for mode in ("eFifo","eMailbox","eImmediate"):
              assert "vk::PresentModeKHR::"+mode in present
          profiles=(root/"java/org/stratoemu/strato/settings/SynolsisGpuProfiles.kt").read_text()
          assert 'const val FPS_HACK = "fps_hack"' in profiles
          assert "settings.enableFastReadbackWrites = false" in profiles
          assert "HeaderBatchSize{16}" in cache
          assert "if (++pendingHeaderUpdates >= HeaderBatchSize)" in cache
          assert "flushHeader();" in cache
          assert "windowTransformApplied = false" in present
          assert "if (!windowTransformApplied || frame.transform != windowTransform)" in present
          assert "windowTransformApplied" in present_h
          worker_entries=frame_xml.find("./string-array[@name='synolsis_shader_threads_entries']")
          worker_values=frame_xml.find("./integer-array[@name='synolsis_shader_threads_values']")
          assert worker_entries is not None and worker_values is not None
          assert [int(v.text) for v in worker_values]==[0,1,2,4]
          assert "shader_compile_threads" in integer_prefs
          for field in ("shaderCompileThreads",):
              assert field in settings_cpp and field in android_cpp
              assert field in kotlin and field in kpref
          assembler=(root/"cpp/skyline/gpu/graphics_pipeline_assembler.cpp").read_text()
          assembler_h=(root/"cpp/skyline/gpu/graphics_pipeline_assembler.h").read_text()
          assert "pipelineCompileThreads" in assembler_h and "pipelineCompileThreads" in assembler
          assert "brokenMultithreadedPipelineCompilation ? 1U" in assembler
          assert "MaxPipelineCacheBytes{256ULL * 1024 * 1024}" in assembler
          assert "file_size(path, sizeError)" in assembler
          assert 'path.string() + ".writing"' in assembler
          assert "std::filesystem::rename(temporaryPath, path, replaceError)" in assembler
          assert "std::min(pipelineCompileThreads, 4U)" in assembler
          print("PASS: real async compiler thread selection, bounded and atomic Vulkan driver cache")
          print("PASS: bounded shader-cache header batching and ANativeWindow transform reuse")
          print("PASS: GPU profiler, frame-skipping with callbacks, Vulkan mode and native settings")
          print("PASS: separated settings and Vulkan physical-driver fingerprint identity")
          # Synolsis v2: diagnostics only expose existing native telemetry,
          # and the MIUI refresh-rate IPC must address the actual Android app.
          emulation=(root/"java/org/stratoemu/strato/EmulationActivity.kt").read_text()
          assert 'setFpsIntent.putExtra("package_name", packageName)' in emulation
          assert '"skyline.emu"' not in emulation
          assert "averageFrametimeDeviation" in emulation
          assert "emulationSettings.perfStatsDetails" in emulation
          assert "this@EmulationActivity.isDestroyed" in emulation
          assert "postDelayed(this, 500)" in emulation
          prefs=(root/"java/org/stratoemu/strato/settings/EmulationSettings.kt").read_text()
          assert "var perfStatsDetails by sharedPreferences" in prefs
          assert 'app:key="perf_stats_details"' in (root/"res/xml/emulation_preferences.xml").read_text()
          profiles=(root/"java/org/stratoemu/strato/settings/SynolsisGpuProfiles.kt").read_text()
          assert "fun currentMode(readback : Boolean, fastWrites : Boolean)" in profiles
          assert "settings.enableFastReadbackWrites = false" in profiles
          cache=(root/"cpp/skyline/gpu/pipeline_cache_manager.cpp").read_text()
          assert "Pipeline cache has an impossible pipeline count" in cache
          assert "mainStream.seekg(sizeof(PipelineCacheFileHeader), std::ios::beg)" in cache
          gradle=Path("app/build.gradle").read_text()
          cmake=Path("app/CMakeLists.txt").read_text()
          assert "optimized {" in gradle and 'arguments "-DCMAKE_BUILD_TYPE=RELEASE"' in gradle
          assert 'applicationId "org.synolsis.emu"' in gradle
          assert 'set(CMAKE_CXX_FLAGS_DEBUG "-O0' in cmake
          assert 'set(CMAKE_CXX_FLAGS_RELEASE "-Ofast' in cmake
          assert "minifyEnabled false" in gradle
          # Localization: Portuguese (Brazil) is selectable and actually
          # translates the bulk of the original Skyline preference strings.
          pt=ET.parse(root/"res/values-pt-rBR/strings.xml").getroot()
          default=ET.parse(root/"res/values/strings.xml").getroot()
          pt_ids={x.attrib.get("name") for x in pt.findall("string")}
          default_ids={x.attrib.get("name") for x in default.findall("string")}
          assert len(pt_ids & default_ids) >= 285, "Insufficient Brazilian Portuguese coverage"
          # The Update/DLC screens must import, verify and store real NSPs,
          # but must not pretend to activate packages without a native mount.
          store=(root/"java/org/stratoemu/strato/data/GameContentStore.kt").read_text()
          manager=(root/"java/org/stratoemu/strato/GameContentManagerActivity.kt").read_text()
          app_dialog=(root/"java/org/stratoemu/strato/AppDialog.kt").read_text()
          layout=ET.parse(root/"res/layout/app_dialog.xml")
          for field in ("game_install_update", "game_install_dlc"):
              assert any(n.attrib.get("{http://schemas.android.com/apk/res/android}id")=="@+id/"+field for n in layout.iter())
          assert "GameContentManagerActivity::class.java" in app_dialog
          assert "PFS0" in store and "validatePfs0(staging)" in store
          assert "ActivityResultContracts.OpenDocument()" in manager
          assert "synolsis_content_not_active" in manager
          manifest=ET.parse(root/"AndroidManifest.xml")
          assert any(node.attrib.get("{http://schemas.android.com/apk/res/android}name")==".GameContentManagerActivity" for node in manifest.iter())
          ET.parse(root/"res/values/synolsis_game_content_strings.xml")
          ET.parse(root/"res/values-pt-rBR/synolsis_game_content_strings.xml")
          ET.parse(root/"res/values-pt-rBR/synolsis_frame_skip.xml")
          ET.parse(root/"res/values-pt-rBR/synolsis_gpu_presets.xml")
          print("PASS: game-specific NSP import/removal, pt-BR and honest inactive-content status")
          assert '"pt-BR"' in gradle
          android_ns="{http://schemas.android.com/apk/res/android}"
          locales=ET.parse(root/"res/xml/locales_config.xml").getroot()
          assert any(x.get(android_ns+"name")=="pt-BR" for x in locales)
          # All resource files below are part of the unified V4 frontend.
          # Do not assert obsolete GameContentActivity names from an abandoned
          # prototype: V4 uses GameContentManagerActivity/GameContentStore.
          for name in ("synolsis_ui_strings.xml", "synolsis_frame_skip.xml",
                       "synolsis_gpu_presets.xml", "synolsis_game_content_strings.xml"):
              ET.parse(root/"res/values-pt-rBR"/name)
          ET.parse(root/"res/values/synolsis_game_content_strings.xml")
          assert "GameContentManagerActivity::class.java" in app_dialog
          assert "ActivityResultContracts.OpenDocument()" in manager
          assert "validatePfs0" in store and "GameContentStore" in manager
          cache_clean=(root/"java/org/stratoemu/strato/utils/GameShaderCacheUtils.kt").read_text()
          assert "graphics_pipeline_cache" in cache_clean
          assert "vk_graphics_pipeline_cache" in cache_clean
          assert "synolsisClearGameCache" in app_dialog
          assert "@+id/synolsis_clear_game_cache" in (root/"res/layout/app_dialog.xml").read_text()
          print("PASS: pt-BR, validated NSP storage, per-game shader cache cleanup")

          print("PASS: Synolsis optimized APK variant versus -O0 debug baseline")
          print("PASS: Synolsis v2 MIUI, native frametime HUD, readback consistency and cache validation")

          PY

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Exclude only known unused Oboe sample wrapper
        shell: bash
        run: |
          set -euo pipefail
          unused=app/libraries/oboe/apps/OboeTester/gradle/wrapper/gradle-wrapper.jar
          if [ -f "$unused" ]; then
            printf '%s  %s\n' 'e2b82129ab64751fd40437007bd2f7f2afb3c6e41a9198e628650b22d5824a14' "$unused" | sha256sum --check --status
            rm -- "$unused"
          fi

      - name: Setup Gradle with caching and wrapper validation
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install Android SDK/NDK with retry on broken download
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ccache >/dev/null || ! command -v ninja >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ccache ninja-build
          fi
          mkdir -p "$CCACHE_DIR"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then
            SDKMGR="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          fi
          test -n "$SDKMGR"

          install_checked() {
            local spec="$1"
            local directory="$2"
            local marker="$3"
            if [ -f "$directory/$marker" ]; then
              echo "Already installed: $spec"
              return 0
            fi
            for attempt in 1 2 3 4; do
              echo "::group::Installing $spec (attempt $attempt/4)"
              # SDK archives can occasionally arrive truncated or as an
              # invalid ZIP from the mirror. Never treat a partial NDK as valid.
              if "$SDKMGR" --install "$spec" && [ -f "$directory/$marker" ]; then
                echo "::endgroup::"
                return 0
              fi
              echo "::warning::$spec download or validation failed (attempt $attempt)"
              echo "::endgroup::"
              if [ "$attempt" -eq 4 ]; then
                echo "::error::Failed to install $spec after four attempts"
                return 1
              fi
              rm -rf -- "$HOME/.android/cache"
              # A failed NDK extract can leave an invalid directory in place.
              # The directory is under the runner's ephemeral SDK installation.
              if [ ! -f "$directory/$marker" ] && [ -d "$directory" ]; then
                rm -rf -- "$directory"
              fi
              sleep $((attempt * 8))
            done
          }

          install_checked "platforms;android-34" "$SDK_ROOT/platforms/android-34" "android.jar"
          install_checked "build-tools;34.0.0" "$SDK_ROOT/build-tools/34.0.0" "aapt2"
          install_checked "ndk;26.1.10909125" "$SDK_ROOT/ndk/26.1.10909125" "source.properties"
          install_checked "cmake;3.22.1" "$SDK_ROOT/cmake/3.22.1" "bin/cmake"
          echo "Android SDK/NDK validated after installation"

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: synolsis-ui-ccache-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            synolsis-ui-ccache-v1-${{ runner.os }}-
            synolsis-ccache-v1-${{ runner.os }}-
            adreno-experimental-ccache-v1-${{ runner.os }}-
            strato-ccache-v1-${{ runner.os }}-

      - name: Build Synolsis Emu APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          BUILD_TYPE="${{ inputs.build_type || 'optimized' }}"
          case "$BUILD_TYPE" in
            optimized)
              echo "Building optimized Strato core (-Ofast/LTO native), without R8 shrinking"
              ./gradlew :app:assembleMainlineOptimized --no-daemon --stacktrace --build-cache
              ;;
            debug)
              echo "Building original unoptimized Debug baseline"
              ./gradlew :app:assembleMainlineDebug --no-daemon --stacktrace --build-cache
              ;;
            *)
              echo "::error::Unknown build_type $BUILD_TYPE"
              exit 1
              ;;
          esac

      - name: Report compiler cache stats
        if: always()
        run: command -v ccache >/dev/null && ccache --show-stats || true

      - name: Upload Synolsis APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: synolsis-emu-ptbr-game-content-v4-${{ inputs.build_type || 'optimized' }}-${{ github.run_number }}
          path: app/build/outputs/apk/mainline/*/*.apk
          if-no-files-found: error
          retention-days: 30
