name: Synolsis V44 NVDEC bridge validation (no APK publishing)

on:
  push:
    branches:
      - feature/synolsis-v44-nvdec-guest-stream-bridge
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-native:
    name: Check NVDEC bounds and source integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run independent C++20 NVDEC test
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic \
            tests/nvdec_guest_stream_policy_test.cpp -o /tmp/v44_nvdec_test
          /tmp/v44_nvdec_test
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic \
            tests/vic_yuv420_output_test.cpp -o /tmp/v44_vic_test
          /tmp/v44_vic_test
      - name: Verify wiring and legacy Vulkan regressions
        run: |
          set -euo pipefail
          python3 tests/synolsis_v44_bridge_integration_test.py
          python3 tests/synolsis_v43_integration_test.py
          python3 tests/synolsis_v40_integration_test.py
      - name: Summary
        run: |
          echo '### V44 NVDEC partial bridge' >> "$GITHUB_STEP_SUMMARY"
          echo 'SMMU input + codec path have native regression tests.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This workflow does NOT publish APKs; VIC linear YUV420 is conditional. Full cutscenes, internal resolution and frame generation remain device-unverified.' >> "$GITHUB_STEP_SUMMARY"

  android-native:
    name: Compile V44 Android Kotlin and ARM64 native core (no APK release)
    needs: host-native
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: 'true'
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Install exact Android native toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache ninja-build
          mkdir -p "$CCACHE_DIR"
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
          test -f "$ANDROID_HOME/ndk/26.1.10909125/source.properties"
      - name: Compile frontend and full native ARM64 APK without publishing
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:compileMainlineOptimizedKotlin --no-daemon --build-cache
          ./gradlew :app:assembleMainlineOptimized --no-daemon --stacktrace --build-cache
          ls -lah app/build/outputs/apk/mainline/*/*.apk
          echo "Compiled V44 native changes, no release published." >> "$GITHUB_STEP_SUMMARY"
