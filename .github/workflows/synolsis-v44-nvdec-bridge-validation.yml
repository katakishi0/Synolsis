name: Synolsis V44 NVDEC bridge validation (no APK publishing)

on:
  push:
    branches:
      - feature/synolsis-v44-nvdec-guest-stream-bridge
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-native:
    name: Check NVDEC bounds and source integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run independent C++20 NVDEC test
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic \
            tests/nvdec_guest_stream_policy_test.cpp -o /tmp/v44_nvdec_test
          /tmp/v44_nvdec_test
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic \
            tests/vic_yuv420_output_test.cpp -o /tmp/v44_vic_test
          /tmp/v44_vic_test
      - name: Verify wiring and legacy Vulkan regressions
        run: |
          set -euo pipefail
          python3 tests/synolsis_v44_bridge_integration_test.py
          python3 tests/synolsis_v43_integration_test.py
          python3 tests/synolsis_v40_integration_test.py
      - name: Summary
        run: |
          echo '### V44 NVDEC partial bridge' >> "$GITHUB_STEP_SUMMARY"
          echo 'SMMU input + codec path have native regression tests.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This workflow does NOT publish APKs; VIC linear YUV420 is conditional. Full cutscenes, internal resolution and frame generation remain device-unverified.' >> "$GITHUB_STEP_SUMMARY"
